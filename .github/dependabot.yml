version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: soundteam-2.0
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - security
    groups:
      expo-compatible:
        patterns:
          - "expo*"
          - "react-native*"
          - "@expo/*"
      other-dependencies:
        patterns:
          - "*"
