name: Encrypted Supabase backup

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Check backup secrets
        id: preflight
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ] || [ -z "$BACKUP_ENCRYPTION_PASSPHRASE" ]; then
            echo "::notice::Add SUPABASE_DB_URL and BACKUP_ENCRYPTION_PASSPHRASE in GitHub Actions secrets to enable encrypted backups."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install PostgreSQL client
        if: steps.preflight.outputs.enabled == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client openssl

      - name: Verify database connection settings (safe)
        if: steps.preflight.outputs.enabled == 'true'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          python3 - <<'PY'
          import os
          from urllib.parse import urlsplit
          value = os.environ.get("SUPABASE_DB_URL", "")
          parsed = urlsplit(value)
          print("Connection scheme:", parsed.scheme or "MISSING")
          print("Connection host:", parsed.hostname or "MISSING")
          print("Connection port:", parsed.port or "DEFAULT")
          print("Connection user:", parsed.username or "MISSING")
          if parsed.password is None:
              print("Password field: MISSING")
          else:
              print("Password field: PRESENT (value hidden)")
          PY

      - name: Dump and encrypt database
        if: steps.preflight.outputs.enabled == 'true'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
        run: |
          set -euo pipefail
          umask 077
          pg_dump --no-owner --no-acl --format=custom "$SUPABASE_DB_URL" --file=soundteam.dump
          openssl enc -aes-256-cbc -pbkdf2 -iter 600000 -salt \
            -pass env:BACKUP_ENCRYPTION_PASSPHRASE \
            -in soundteam.dump -out soundteam.dump.enc
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 \
            -pass env:BACKUP_ENCRYPTION_PASSPHRASE \
            -in soundteam.dump.enc | pg_restore --list > /tmp/soundteam-backup-check.txt
          test -s /tmp/soundteam-backup-check.txt
          rm -f soundteam.dump /tmp/soundteam-backup-check.txt

      - name: Store encrypted backup for 90 days
        if: steps.preflight.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: soundteam-encrypted-db-backup-${{ github.run_id }}
          path: soundteam.dump.enc
          if-no-files-found: error
          retention-days: 90
