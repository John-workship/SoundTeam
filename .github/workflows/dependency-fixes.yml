name: Prepare dependency security fixes

on:
  push:
    branches: [soundteam-2.0]
  schedule:
    - cron: "37 9 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dependency-fixes
  cancel-in-progress: true

jobs:
  prepare-fixes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - name: Install current dependencies
        run: npm install --ignore-scripts
      - name: Apply non-breaking security fixes
        run: npm audit fix --ignore-scripts || true
      - name: Create security update pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: security/npm-audit-fixes
          base: soundteam-2.0
          delete-branch: true
          title: "security: apply compatible npm vulnerability fixes"
          commit-message: "security: update vulnerable npm dependencies"
          body: |
            Automated dependency maintenance.
            Applies only npm audit fixes that do not require forced major-version changes.
            Review Expo/React Native compatibility and run the web build before merging.
          labels: dependencies, security
