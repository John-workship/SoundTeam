name: Production secret scan

on:
  schedule:
    - cron: "52 8 * * 3"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full production branch history
        uses: actions/checkout@v5
        with:
          ref: soundteam-2.0
          fetch-depth: 0
      - name: Scan production branch history for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
